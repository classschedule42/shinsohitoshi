<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shinso Hitoshi</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 120px 20px 40px 20px;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #667eea, #764ba2, #f093fb, #4facfe);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            opacity: 0.1;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            position: relative;
            z-index: 10;
            background: rgba(15, 20, 50, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 60px 50px;
            box-shadow: 0 30px 90px rgba(102, 126, 234, 0.5);
            max-width: 1100px;
            width: 100%;
            border: 2px solid rgba(102, 126, 234, 0.3);
            animation: containerEntry 1s ease-out;
            transform-style: preserve-3d;
            transition: transform 0.1s ease;
        }

        @keyframes containerEntry {
            from {
                opacity: 0;
                transform: translateY(50px) rotateX(-15deg);
            }
            to {
                opacity: 1;
                transform: translateY(0) rotateX(0deg);
            }
        }

        .nav-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(10, 14, 39, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(102, 126, 234, 0.3);
            animation: navEntry 1s ease-out;
            z-index: 100;
        }

        @keyframes navEntry {
            from {
                opacity: 0;
                transform: translateY(-100%);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-logo-img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.6);
            transition: transform 0.3s ease;
        }

        .nav-logo-img:hover {
            transform: scale(1.1) rotate(10deg);
        }

        .nav-logo-text {
            font-size: 1.5em;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px rgba(102, 126, 234, 0.8);
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2) 0%, rgba(118, 75, 162, 0.2) 100%);
            color: white;
            border: 2px solid rgba(102, 126, 234, 0.5);
            padding: 12px 25px;
            border-radius: 15px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            animation: btnEntry 0.6s ease-out both;
            white-space: nowrap;
            text-decoration: none;
            display: inline-block;
        }

        .nav-btn:nth-child(1) { animation-delay: 0.3s; }
        .nav-btn:nth-child(2) { animation-delay: 0.4s; }
        .nav-btn:nth-child(3) { animation-delay: 0.5s; }

        @keyframes btnEntry {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .nav-btn:hover::before {
            left: 100%;
        }

        .nav-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.6);
            border-color: rgba(240, 147, 251, 0.8);
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.4) 0%, rgba(240, 147, 251, 0.4) 100%);
        }

        .logo-container {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 30px;
            animation: logoEntry 1.2s ease-out 0.3s both;
        }

        @keyframes logoEntry {
            from {
                opacity: 0;
                transform: scale(0.5) rotate(-180deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .logo {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            margin-bottom: 25px;
            box-shadow: 0 0 50px rgba(102, 126, 234, 0.8);
            animation: logoFloat 3s ease-in-out infinite, logoGlow 2s ease-in-out infinite;
            transition: transform 0.3s ease;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        @keyframes logoGlow {
            0%, 100% { 
                box-shadow: 0 0 50px rgba(102, 126, 234, 0.8),
                            0 0 100px rgba(102, 126, 234, 0.4);
            }
            50% { 
                box-shadow: 0 0 80px rgba(240, 147, 251, 0.8),
                            0 0 130px rgba(240, 147, 251, 0.4);
            }
        }

        .logo:hover {
            transform: scale(1.1) rotate(10deg);
        }

        h1 {
            color: #fff;
            font-size: 3.5em;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(102, 126, 234, 0.8);
            animation: textGlow 3s ease-in-out infinite;
        }

        @keyframes textGlow {
            0%, 100% {
                text-shadow: 0 0 20px rgba(102, 126, 234, 0.8),
                             0 0 40px rgba(102, 126, 234, 0.4);
            }
            50% {
                text-shadow: 0 0 30px rgba(240, 147, 251, 0.8),
                             0 0 60px rgba(240, 147, 251, 0.4);
            }
        }

        .subtitle {
            color: #b8b8d1;
            font-size: 1.3em;
            margin-bottom: 30px;
            font-weight: 300;
            animation: fadeIn 1s ease-out 0.6s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .live-status-container {
            background: rgba(20, 25, 60, 0.6);
            border-radius: 20px;
            padding: 30px;
            margin: 30px 0;
            border: 2px solid rgba(102, 126, 234, 0.3);
            animation: fadeIn 1s ease-out 1s both;
        }

        .status-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .status-icon {
            font-size: 2em;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        .status-text {
            color: #fff;
            font-size: 1.5em;
            text-shadow: 0 0 15px rgba(102, 126, 234, 0.6);
            transition: color 0.5s ease;
        }

        .stats-container {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(102, 126, 234, 0.1);
            border: 2px solid rgba(102, 126, 234, 0.3);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            flex: 1;
            min-width: 150px;
            transition: all 0.3s ease;
            animation: statEntry 0.6s ease-out both;
        }

        .stat-card:nth-child(1) { animation-delay: 1.2s; }
        .stat-card:nth-child(2) { animation-delay: 1.4s; }
        .stat-card:nth-child(3) { animation-delay: 1.6s; }

        @keyframes statEntry {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            border-color: rgba(240, 147, 251, 0.5);
        }

        .stat-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 1em;
            color: #b8b8d1;
        }

        .last-update {
            text-align: center;
            margin-top: 20px;
            color: #b8b8d1;
            font-size: 0.9em;
        }

        .footer {
            margin-top: 50px;
            text-align: center;
            color: #b8b8d1;
            font-size: 0.95em;
            animation: fadeIn 1s ease-out 1.6s both;
        }

        @media (max-width: 768px) {
            body {
                padding: 160px 20px 40px 20px;
            }

            .container {
                padding: 40px 30px;
            }

            .nav-bar {
                flex-direction: column;
                gap: 15px;
                padding: 15px 20px;
            }

            .nav-buttons {
                flex-wrap: wrap;
                justify-content: center;
            }

            h1 {
                font-size: 2.5em;
            }

            .logo-container {
                margin-top: 20px;
            }

            .status-text {
                font-size: 1.2em;
            }

            .stat-card {
                min-width: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="nav-bar">
        <div class="nav-logo">
            <img src="shinso.jpeg" alt="Logo" class="nav-logo-img">
            <span class="nav-logo-text">Shinso Hitoshi</span>
        </div>
        <div class="nav-buttons">
            <a href="stream.html" class="nav-btn">
                <span>📺 ช่องทางสตรีม</span>
            </a>
            <a href="https://discord.com/invite/BCrmxqKfKy" target="_blank" class="nav-btn">
                <span>💬 ดิสคอร์ด</span>
            </a>
            <a href="donate.html" class="nav-btn">
                <span>💰 โดเนท</span>
            </a>
        </div>
    </div>

    <div class="container" id="container">
        <div class="logo-container">
            <img src="shinso.jpeg" alt="Logo" class="logo" id="logo">
            <h1>🎮 ยินดีต้อนรับนะครับ 🎮</h1>
            <p class="subtitle">ฮายๆ ผม ชินโซ นะครับ</p>
        </div>

        <div class="live-status-container">
            <div class="status-header">
                <span class="status-icon" id="statusIcon">🔴</span>
                <h2 class="status-text" id="statusText">Shinso Hitoshi | ยังไม่ไลฟ์... 🔴</h2>
            </div>
            <div class="stats-container" id="statsContainer" style="display: none;">
                <div class="stat-card">
                    <div class="stat-icon">👥</div>
                    <div class="stat-value" id="viewerCount">0</div>
                    <div class="stat-label">ผู้ชม</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">❤️</div>
                    <div class="stat-value" id="likeCount">0</div>
                    <div class="stat-label">ไลค์</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">⏱️</div>
                    <div class="stat-value" id="duration">0:00</div>
                    <div class="stat-label">ระยะเวลา</div>
                </div>
            </div>
            <div class="last-update" id="lastUpdate">อัพเดทล่าสุด: -</div>
        </div>

        <div class="footer">
            <p>💙</p>
        </div>
    </div>

    <script>
        // ใช้ URL ของ Render หรือ localhost
        const API_URL = window.location.hostname === 'localhost' 
            ? 'http://localhost:3000' 
            : window.location.origin;
        const TIKTOK_USERNAME = 'snowball_iak';
        
        let socket;

        function connectWebSocket() {
            socket = io(API_URL, {
                reconnection: true,
                reconnectionDelay: 1000,
                reconnectionDelayMax: 5000,
                reconnectionAttempts: Infinity
            });

            socket.on('connect', () => {
                console.log('✅ เชื่อมต่อ WebSocket สำเร็จ');
            });

            socket.on('disconnect', () => {
                console.log('❌ ตัดการเชื่อมต่อ WebSocket');
            });

            socket.on('liveStatus', (data) => {
                console.log('📊 รับข้อมูลใหม่:', data);
                updateLiveStatus(data);
            });

            socket.on('connect_error', (error) => {
                console.error('❌ เกิดข้อผิดพลาดในการเชื่อมต่อ:', error);
            });
        }

        function updateLiveStatus(data) {
            const statusText = document.getElementById('statusText');
            const statusIcon = document.getElementById('statusIcon');
            const statsContainer = document.getElementById('statsContainer');
            const lastUpdate = document.getElementById('lastUpdate');
            
            // อัพเดทเวลาปัจจุบัน
            const now = new Date().toLocaleTimeString('th-TH');
            lastUpdate.textContent = `อัพเดทล่าสุด: ${now}`;
            
            if (data.isLive) {
                statusText.textContent = `${TIKTOK_USERNAME} | กำลังไลฟ์อยู่ 🟢`;
                statusIcon.textContent = '🟢';
                statusText.style.color = '#4ade80';
                
                statsContainer.style.display = 'flex';
                
                document.getElementById('viewerCount').textContent = 
                    (data.viewerCount || 0).toLocaleString();
                document.getElementById('likeCount').textContent = 
                    (data.likeCount || 0).toLocaleString();
                
                const duration = data.duration || 0;
                const hours = Math.floor(duration / 3600);
                const minutes = Math.floor((duration % 3600) / 60);
                const seconds = duration % 60;
                
                let durationText = '';
                if (hours > 0) {
                    durationText = `${hours}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                } else {
                    durationText = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                }
                document.getElementById('duration').textContent = durationText;
                
            } else {
                statusText.textContent = `Shinso Hitoshi | ยังไม่ไลฟ์... 🔴`;
                statusIcon.textContent = '🔴';
                statusText.style.color = '#f87171';
                statsContainer.style.display = 'none';
            }
        }

        async function fetchLiveStatus() {
            try {
                const response = await fetch(`${API_URL}/api/live-status`);
                const result = await response.json();
                
                if (result.success) {
                    updateLiveStatus(result.data);
                }
            } catch (error) {
                console.error('❌ ไม่สามารถดึงข้อมูลจาก API ได้:', error);
            }
        }

        // Mouse tracking effects
        const container = document.getElementById('container');
        
        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = (y - centerY) / 300;
            const rotateY = (centerX - x) / 300;
            
            container.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });
        
        container.addEventListener('mouseleave', () => {
            container.style.transform = 'perspective(1000px) rotateX(0) rotateY(0)';
        });

        const logo = document.getElementById('logo');
        logo.addEventListener('mousemove', (e) => {
            const rect = logo.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            const angle = Math.atan2(y, x) * (180 / Math.PI);
            logo.style.transform = `scale(1.1) rotate(${angle}deg)`;
        });
        
        logo.addEventListener('mouseleave', () => {
            logo.style.transform = 'scale(1) rotate(0deg)';
        });

        // เริ่มต้น
        connectWebSocket();
        
        // ดึงข้อมูลทุก 30 วินาที
        setInterval(fetchLiveStatus, 30000);
        
        // ดึงข้อมูลครั้งแรกทันที
        fetchLiveStatus();
    </script>
</body>
</html>
